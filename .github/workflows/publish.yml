name: Publish verified 52Hertz Lite release

on:
  push:
    paths:
      - ".transfer/READY"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reassemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "12c743cf6e080ed62e0008e9b5e7f269ac7a401b2026354a624282d81acd4896  /tmp/source.zip" | sha256sum --check -

      - name: Replace staging tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          unzip -q /tmp/source.zip -d .

      - name: Verify candidate
        run: npm test

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish 52Hertz Lite 1.0.0-rc.3"
          git push

      - name: Build release
        run: python tools/build-release.py

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "v1.0.0-rc.3"             "dist/52hertz-lite-1.0.0-rc.3.zip"             "dist/52hertz-lite-1.0.0-rc.3.zip.sha256"             --target main             --title "52Hertz Lite 1.0.0-rc.3"             --notes "Static deterministic radio: no PHP, no database, no playout server."             --prerelease

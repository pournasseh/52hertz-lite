name: Publish verified source

on:
  push:
    paths:
      - ".transfer/READY"

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reassemble and verify source
        shell: bash
        run: |
          set -euo pipefail
          cat .transfer/part-* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.zip
          echo "156491f93441bafaf87fac578e76f29f110fc7a019853b699579f69ae5fa977d  /tmp/source.zip" | sha256sum --check -

      - name: Replace staging tree without modifying this workflow
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          find .github/workflows -mindepth 1 -maxdepth 1 ! -name publish.yml -exec rm -rf {} +
          unzip -q /tmp/source.zip -d .

      - name: Verify candidate
        shell: bash
        run: |
          npm test

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish 52Hertz Lite 1.0.0-rc.3"
          git push

      - name: Prove release build
        run: python tools/build-release.py
